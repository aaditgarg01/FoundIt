services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foundit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-foundit}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - foundit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  setup:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foundit_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-foundit}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node scripts/migrate.js && node db/scripts/seed_reference.js"
    restart: "no"
  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foundit_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-foundit}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  foundit_data:
